      .badge.ticket-mini { color: #6B5A2E; background: #F7EDD8; margin-top: 4px; font-variant-numeric: tabular-nums; }
      .meta { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: #7A7466; margin: 3px 0 6px; font-weight: 600; flex-wrap: wrap; }
      .desc { font-size: 13.5px; line-height: 1.45; color: #454032; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .card-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 8px; flex-wrap: wrap; }
      .host { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; }
      .langs { display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: #7A7466; font-weight: 600; }
      .card.slim { align-items: center; }
      .chat-dot { background: #E3A23C; color: #fff; font-size: 11px; font-weight: 800; min-width: 20px; height: 20px; border-radius: 999px; display: grid; place-items: center; padding: 0 5px; }

      .avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 15px; flex-shrink: 0; }
      .avatar-sm { width: 24px; height: 24px; font-size: 12px; }
      .avatar-lg { width: 46px; height: 46px; font-size: 19px; }
      .avatar.dashed { background: transparent; border: 2px dashed #D9CBB2; color: #C4B694; }
      img.avatar { border: 1.5px solid #E3DAC5; }

      /* Lokacioni */
      .loc-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: #fff; border: 1.5px solid #EDE4D0; border-radius: 14px; padding: 10px 12px; margin-bottom: 12px; flex-wrap: wrap; }
      .loc-info { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: #454032; }
      .loc-link { background: none; border: none; font-family: inherit; font-size: 13px; font-weight: 700; color: #244AA5; cursor: pointer; text-decoration: underline; padding: 0; }

      /* Kërkesat */
      .requests { margin-bottom: 14px; }
      .req-card { display: flex; align-items: center; gap: 11px; background: #FFFDF6; border: 1.5px solid #EBDFC0; border-radius: 16px; padding: 11px 13px; margin-bottom: 8px; }
      .req-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .req-info strong { font-size: 14.5px; }
      .req-actions { display: flex; gap: 7px; }
      .btn-approve { display: inline-flex; align-items: center; gap: 5px; background: #1B7A3D; color: #fff; border: none; border-radius: 11px; padding: 9px 13px; font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer; }
      .btn-reject { display: grid; place-items: center; width: 38px; height: 38px; background: #FBEAEA; color: #A33; border: 1.5px solid #EFC7C7; border-radius: 11px; cursor: pointer; }

      /* Empty */
      .empty { text-align: center; padding: 44px 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
      .empty p { font-size: 15px; }

      /* FAB & nav */
      .fab { position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 7px; background: #E3A23C; color: #2C1F04; border: none; border-radius: 999px; padding: 13px 22px; font-family: inherit; font-weight: 800; font-size: 15px; cursor: pointer; box-shadow: 0 6px 20px rgba(227,162,60,.45); z-index: 6; transition: transform .1s; }
      .fab:active { transform: translateX(-50%) scale(.96); }
      .nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; display: flex; background: #fff; border-top: 1.5px solid #EDE4D0; z-index: 6; }
      .nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 0 14px; border: none; background: none; font-family: inherit; font-size: 11.5px; font-weight: 700; color: #9A937F; cursor: pointer; position: relative; }
      .nav button.on { color: #244AA5; }
      .nav-count { position: absolute; top: 6px; right: calc(50% - 34px); background: #E3A23C; color: #fff; font-style: normal; font-size: 10px; font-weight: 800; min-width: 16px; height: 16px; border-radius: 999px; display: grid; place-items: center; }

      /* Sheet */
      .sheet-wrap { position: fixed; inset: 0; background: rgba(30,36,50,.45); z-index: 10; display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
      .sheet { background: #FAF6EE; width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; border-radius: 24px 24px 0 0; padding: 18px 18px 28px; animation: up .25s cubic-bezier(.2,.8,.3,1); }
      @keyframes fade { from { opacity: 0 } }
      @keyframes up { from { transform: translateY(40px); opacity: 0 } }
      @media (prefers-reduced-motion: reduce) { .sheet, .sheet-wrap, .spinner { animation: none } }
      .sheet-hdr { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
      .sheet-hdr > div { flex: 1; min-width: 0; }
      .sheet-hdr h2 { font-size: 19px; font-weight: 800; }
      .sheet-desc { font-size: 14.5px; line-height: 1.55; color: #454032; margin-bottom: 12px; }
      .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
      .tag { font-size: 12px; font-weight: 700; background: #F0E7D8; color: #6B5A2E; padding: 4px 10px; border-radius: 999px; }
      .icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid #E3DAC5; background: #fff; display: grid; place-items: center; cursor: pointer; color: #454032; flex-shrink: 0; }
      .label { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: #9A8F73; margin: 10px 0 8px; }
      .people { margin-bottom: 14px; }
      .people-row { display: flex; gap: 12px; flex-wrap: wrap; }
      .person { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; }
      .person em { font-style: normal; color: #B07C1E; font-size: 10px; display: block; }
      .person.free span { color: #C4B694; }
      .fee-note { display: flex; align-items: flex-start; justify-content: center; gap: 5px; font-size: 11.5px; color: #9A8F73; font-weight: 600; margin-top: 8px; text-align: center; line-height: 1.45; }

      /* Host box */
      .host-box { display: flex; align-items: center; gap: 10px; background: #fff; border: 1.5px solid #EDE4D0; border-radius: 16px; padding: 12px 14px; margin-bottom: 12px; }
      .host-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .host-info strong { display: flex; align-items: center; gap: 5px; font-size: 14.5px; }

      /* Ticket */
      .ticket { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: #FFF8E8; border: 2px dashed #E3A23C; border-radius: 16px; padding: 12px 14px; margin-bottom: 12px; }
      .ticket.big { padding: 16px; margin: 18px 0; }
      .ticket-left { display: flex; align-items: center; gap: 10px; color: #8A6A1E; }
      .ticket-left strong { display: block; font-size: 12px; color: #6B5A2E; }
      .ticket-code { font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 17px; color: #244AA5; letter-spacing: .5px; font-variant-numeric: tabular-nums; }
      .ticket-note { font-size: 10.5px; font-weight: 700; color: #B07C1E; text-align: right; line-height: 1.35; }

      /* Payment */
      .pay-summary { background: #fff; border: 1.5px solid #EDE4D0; border-radius: 16px; padding: 14px; margin-bottom: 6px; }
      .pay-row { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; padding: 4px 0; gap: 10px; }
      .pay-row.total { border-top: 1.5px solid #EDE4D0; margin-top: 6px; padding-top: 10px; font-weight: 800; font-size: 15px; }
      .pay-methods { display: flex; gap: 8px; margin-bottom: 12px; }
      .method { flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 12px; border-radius: 14px; border: 1.5px solid #E3DAC5; background: #fff; font-family: inherit; font-size: 14px; font-weight: 700; color: #55503F; cursor: pointer; transition: all .15s; }
      .method.on { border-color: #244AA5; background: #EEF2FB; color: #244AA5; }
      .card-form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
      .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .paypal-note { margin-bottom: 14px; }
      .spinner { width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg) } }

      /* Payment success */
      .pay-success { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 12px 4px 4px; }
      .pay-success h2 { font-size: 21px; font-weight: 800; }
      .success-ring { width: 68px; height: 68px; border-radius: 50%; background: #E3F4E8; color: #1B7A3D; display: grid; place-items: center; margin-bottom: 4px; }
      .pay-success .ticket.big { width: 100%; }

      /* Chat */
      .chat { margin-top: 18px; border-top: 1.5px solid #EDE4D0; padding-top: 14px; }
      .chat-msgs { display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto; margin-bottom: 10px; }
      .bubble { background: #fff; border: 1.5px solid #EDE4D0; border-radius: 14px 14px 14px 4px; padding: 8px 12px; max-width: 82%; align-self: flex-start; font-size: 14px; display: flex; flex-direction: column; gap: 2px; }
      .bubble strong { font-size: 11.5px; color: #244AA5; }
      .bubble em { font-style: normal; font-size: 10px; color: #B3AB96; align-self: flex-end; }
      .bubble.mine { align-self: flex-end; background: #244AA5; color: #fff; border: none; border-radius: 14px 14px 4px 14px; }
      .bubble.mine em { color: #A9BCE8; }
      .chat-input { display: flex; gap: 8px; align-items: center; }
      .chat-input input { flex: 1; padding: 11px 14px; border-radius: 999px; border: 1.5px solid #E3DAC5; font-family: inherit; font-size: 14px; background: #fff; min-width: 0; }
      .chat-input input:focus { outline: 2px solid #244AA5; }
      .icon-btn.send { background: #244AA5; color: #fff; border: none; }
      .icon-btn.dice { background: #FFF3DC; color: #B07C1E; border-color: #E9D6A8; }


      /* Darka e së Mërkurës */
      .wed-banner { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; background: linear-gradient(120deg, #1E2432 0%, #244AA5 90%); color: #fff; border: none; border-radius: 18px; padding: 15px 16px; margin-bottom: 12px; cursor: pointer; font-family: inherit; text-align: left; box-shadow: 0 6px 20px rgba(36,74,165,.3); transition: transform .1s; }
      .wed-banner:active { transform: scale(.99); }
      .wed-left { display: flex; flex-direction: column; gap: 3px; }
      .wed-kicker { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; color: #E3A23C; }
      .wed-banner strong { font-size: 15.5px; font-weight: 800; }
      .wed-sub { font-size: 12px; color: #C9D4EE; font-weight: 600; }
      .wed-cta { font-weight: 800; font-size: 14px; color: #E3A23C; white-space: nowrap; }
      .quiz-bar { height: 6px; background: #EDE4D0; border-radius: 999px; margin-bottom: 16px; overflow: hidden; }
      .quiz-fill { height: 100%; background: #E3A23C; border-radius: 999px; transition: width .3s; }
      .quiz-q { font-size: 18px; font-weight: 800; margin-bottom: 14px; line-height: 1.4; }
      .spin-ring { animation: spinslow 1.6s linear infinite; }
      @keyframes spinslow { to { transform: rotate(360deg) } }
      .match-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin: 8px 0; }
      .lock-card { display: flex; align-items: center; gap: 11px; background: #1E2432; color: #fff; border-radius: 16px; padding: 13px 14px; margin-bottom: 12px; flex-wrap: wrap; }
      .lock-card > div { flex: 1; min-width: 150px; display: flex; flex-direction: column; gap: 2px; }
      .lock-card strong { font-size: 13.5px; }
      .lock-card span { font-size: 12px; color: #AEB6C9; line-height: 1.4; }
      .lock-card .btn.ghost { border-color: #E3A23C; color: #E3A23C; }
      .lock-card.slim-lock { width: 100%; background: #F0E7D8; color: #1E2432; }
      .lock-card.slim-lock span { color: #7A7466; }

      /* Vlerësimi */
      .rate-btn { display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; background: #FFF3DC; color: #8A6A1E; border: 1.5px solid #E9D6A8; border-radius: 999px; padding: 5px 11px; font-family: inherit; font-size: 12px; font-weight: 800; cursor: pointer; }
      .rate-stars { display: flex; justify-content: center; gap: 8px; margin: 14px 0 6px; }
      .star-btn { background: none; border: none; cursor: pointer; padding: 4px; transition: transform .1s; }
      .star-btn:active { transform: scale(1.2); }
      .center-label { text-align: center; }


      /* Siluetat e qyteteve */
      .hero { position: relative; overflow: hidden; padding-bottom: 130px !important; }
      .hero-art { position: absolute; bottom: 0; left: 0; right: 0; opacity: .95; pointer-events: none; }
      .ob-inner.steps { position: relative; overflow: hidden; }
      .steps-art { position: absolute; bottom: 0; left: 0; right: 0; opacity: .55; pointer-events: none; }
      .step-body, .step-top { position: relative; z-index: 1; }
      /* FIX: overflow vetëm te arti, jo te header-i — që paneli i njoftimeve të mos pritet */
      .hdr-art { height: 60px; overflow: hidden; }
      .hdr-art { position: absolute; left: 0; right: 0; bottom: -8px; opacity: .5; pointer-events: none; }
      .hdr-top, .city-row { position: relative; z-index: 1; }
      .sheet-art { margin: -18px -18px 6px; opacity: .8; border-radius: 24px 24px 0 0; overflow: hidden; pointer-events: none; }

      /* Lidhjet (kontaktet pas takimit) */
      .connect-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 14px; }
      .conn-pick { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; border: 1.5px solid #E3DAC5; background: #fff; font-family: inherit; font-size: 13px; font-weight: 700; color: #55503F; cursor: pointer; transition: all .15s; }
      .conn-pick.on { border-color: #244AA5; background: #EEF2FB; color: #244AA5; }
      .conn-strip { background: #fff; border: 1.5px solid #EDE4D0; border-radius: 18px; padding: 13px 14px 11px; margin-bottom: 16px; }
      .conn-list { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 3px; scrollbar-width: none; }
      .conn-list::-webkit-scrollbar { display: none; }
      .conn-chip { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; font-family: inherit; font-size: 12px; font-weight: 700; color: #454032; cursor: pointer; }


      /* Përputhja */
      .match-pill { font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; margin-top: 3px; font-variant-numeric: tabular-nums; }
      .match-pill.hot { background: #FDEBD7; color: #B4551A; border: 1.5px solid #F0BE8C; }
      .match-pill.warm { background: #FFF3DC; color: #8A6A1E; border: 1.5px solid #E9D6A8; }
      .match-pill.cool { background: #F0EDE4; color: #7A7466; border: 1.5px solid #E3DAC5; }
      .card.rec { border-color: #E3A23C; position: relative; margin-top: 12px; }
      .rec-ribbon { position: absolute; top: -11px; left: 14px; background: #E3A23C; color: #2C1F04; font-size: 11px; font-weight: 800; padding: 3px 11px; border-radius: 999px; box-shadow: 0 3px 10px rgba(227,162,60,.35); }
      .mq-banner { display: flex; align-items: center; gap: 11px; width: 100%; background: #fff; border: 1.5px dashed #244AA5; border-radius: 16px; padding: 12px 14px; margin-bottom: 12px; cursor: pointer; font-family: inherit; text-align: left; }
      .mq-emoji { font-size: 24px; }
      .mq-txt { flex: 1; font-size: 12.5px; line-height: 1.45; color: #454032; font-weight: 600; }
      .mq-banner .wed-cta { color: #244AA5; }
      .why-box { display: flex; gap: 13px; background: linear-gradient(120deg, #EEF2FB, #FDF7EA); border: 1.5px solid #C9D4EE; border-radius: 16px; padding: 13px 14px; margin-bottom: 12px; align-items: center; }
      .why-score { display: flex; flex-direction: column; align-items: center; min-width: 64px; }
      .why-score strong { font-family: 'Unbounded', sans-serif; font-size: 24px; color: #244AA5; }
      .why-score span { font-size: 10px; font-weight: 800; color: #7A7466; text-transform: uppercase; letter-spacing: .05em; }
      .why-txt { flex: 1; }
      .why-title { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: #244AA5; margin-bottom: 3px; }
      .why-txt p:not(.why-title) { font-size: 12.5px; line-height: 1.5; color: #454032; }


      /* Distinktivat, raportimi, siguria */
      .badge-row { display: flex; gap: 8px; flex-wrap: wrap; }
      .badge-chip { display: inline-flex; align-items: center; gap: 4px; background: #FFF8E8; border: 1.5px solid #E9D6A8; color: #6B5A2E; font-size: 12px; font-weight: 800; padding: 6px 12px; border-radius: 999px; }
      .icon-btn.flag { width: 30px; height: 30px; border-color: #EFC7C7; color: #A33; background: #FDF7F7; margin-left: 6px; }
      .btn.safety { background: #1E2432; color: #fff; margin-bottom: 8px; }
      .notif-actions { display: flex; align-items: center; gap: 8px; }
      .notif-clear { background: none; border: none; font-family: inherit; font-size: 11.5px; font-weight: 800; color: #244AA5; cursor: pointer; text-decoration: underline; }


      /* Vozitjet, përkthimi, modaliteti */
      .badge.ride { color: #1E5A8A; background: #E3F0FA; margin: 2px 0 4px; }
      .mode-toggle { display: flex; gap: 8px; margin-bottom: 6px; }
      .mode-btn { flex: 1; padding: 13px; border-radius: 14px; border: 1.5px solid #E3DAC5; background: #fff; font-family: inherit; font-size: 14.5px; font-weight: 800; color: #55503F; cursor: pointer; transition: all .15s; }
      .mode-btn.on { border-color: #244AA5; background: #EEF2FB; color: #244AA5; }
      .chat-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
      .lang-row { display: flex; align-items: center; gap: 5px; color: #9A8F73; }
      .lang-chip { border: 1.5px solid #E3DAC5; background: #fff; border-radius: 999px; padding: 3px 9px; font-family: inherit; font-size: 10.5px; font-weight: 800; color: #55503F; cursor: pointer; }
      .lang-chip.on { background: #244AA5; border-color: #244AA5; color: #fff; }
      .trans-out { display: block; font-size: 12.5px; font-style: italic; color: #1E5A8A; border-top: 1px dashed #D6E4F0; margin-top: 4px; padding-top: 4px; }
      .bubble.mine .trans-out { color: #C9DCF5; border-top-color: rgba(255,255,255,.25); }
      .bubble-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 2px; }
      .trans-btn { background: none; border: none; font-family: inherit; font-size: 10.5px; font-weight: 800; color: #1E5A8A; cursor: pointer; padding: 0; text-decoration: underline; }
      .bubble-foot em { font-style: normal; font-size: 10px; color: #B3AB96; }


      /* Zgjedhësi i moshës */
      .age-stage { display: flex; align-items: center; justify-content: center; gap: 22px; margin: 6px 0 4px; }
      .age-btn { width: 54px; height: 54px; border-radius: 50%; border: 2px solid #244AA5; background: #fff; color: #244AA5; font-size: 28px; font-weight: 800; font-family: inherit; cursor: pointer; display: grid; place-items: center; transition: transform .1s; line-height: 1; }
      .age-btn.plus { background: #244AA5; color: #fff; }
      .age-btn:active { transform: scale(.92); }
      .age-btn:disabled { opacity: .35; cursor: not-allowed; }
      .age-big-wrap { display: flex; flex-direction: column; align-items: center; min-width: 130px; }
      .age-big { font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 76px; color: #244AA5; line-height: 1; }
      .age-unit { font-size: 13px; font-weight: 800; color: #B07C1E; letter-spacing: .08em; text-transform: uppercase; margin-top: 2px; }
      .age-slider { width: 100%; accent-color: #E3A23C; height: 30px; margin-top: 8px; }
      .age-scale { display: flex; justify-content: space-between; font-size: 10.5px; font-weight: 700; color: #9A8F73; padding: 0 2px; }
      .age-caption { text-align: center; font-size: 14px; font-weight: 700; color: #6B5A2E; background: #FDF7EA; border: 1.5px solid #EFE2C2; border-radius: 999px; padding: 8px 16px; margin: 8px auto 2px; width: fit-content; }
      .step-hint.center { text-align: center; }

      /* Foto: veprimet */
      .photo-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

      /* Përkthimi i thjeshtuar */
      .lang-hint { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 800; color: #1E5A8A; background: #E3F0FA; padding: 4px 10px; border-radius: 999px; }
      .icon-btn.trans { background: #E3F0FA; color: #1E5A8A; border-color: #C6DFF0; }
      .icon-btn.trans.busy { opacity: .5; }
      .icon-btn.trans:disabled { opacity: .35; cursor: not-allowed; }

      /* Vozitje falas + udhëtimi */
      .free-note { font-size: 12.5px; font-weight: 700; color: #1E5A8A; background: #E3F0FA; border: 1.5px solid #C6DFF0; border-radius: 12px; padding: 10px 12px; margin-top: 4px; }
      .badge.trip { color: #7A4A9E; background: #F3EAFB; margin: 2px 0 4px; }


      /* Modali i profilit */
      .sheet-wrap.centerv { align-items: center; padding: 20px; }
      .modal { background: #FAF6EE; border-radius: 24px; padding: 26px 20px 20px; max-width: 340px; width: 100%; text-align: center; position: relative; animation: up .22s cubic-bezier(.2,.8,.3,1); box-shadow: 0 20px 50px rgba(20,25,40,.35); }
      .modal-x { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; }
