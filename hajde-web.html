/* Llogaritja e përputhjes (0-98) — transparente dhe e shpjegueshme */
const matchScore = (t, p, aff) => {
  if (!p.done) return null;
  let s = 50;
  const vibe = t.vibe || CAT_VIBE[t.cat] || {};
  const shared = (vibe.interests || []).filter((i) => p.interests.includes(i));
  s += Math.min(3, shared.length) * 9;
  if (vibe.depth && (vibe.depth === p.depth || p.depth === "te-dyja")) s += 7;
  if (vibe.time && vibe.time === p.time) s += 6;
  const gs = t.spots <= 4 ? "vogla" : t.spots <= 6 ? "mesatare" : "medha";
  if (gs === p.groupSize) s += 5;
  if (vibe.energy && vibe.energy === p.energy) s += 4;
  if ((t.langs || []).some((l) => (p.langs || []).includes(l))) s += 4;
  if (WEEKEND_CAT[p.weekend] === t.cat) s += 4;
  if (p.bizSport === "sport" && t.cat === "sport") s += 4;
  s += Math.max(-8, Math.min(10, aff[t.cat] || 0));
  if (t.mystery) s = Math.max(s, 93);
  return Math.max(45, Math.min(98, Math.round(s)));
};

/* "Pse po ta rekomandojmë?" — arsyet në gjuhë natyrale */
const explainMatch = (t, p, aff) => {
  if (t.mystery) return "Kjo tavolinë u krijua direkt nga përgjigjet e tua — 5 personat u zgjodhën sepse dhanë përgjigje shumë të ngjashme me tuat.";
  const vibe = t.vibe || CAT_VIBE[t.cat] || {};
  const parts = [];
  const shared = (vibe.interests || []).filter((i) => p.interests.includes(i));
  if (shared.length) parts.push(`Ti dhe ${t.host.split(" ")[0]} keni interes të përbashkët për ${shared.join(" dhe ")}.`);
  const gs = t.spots <= 4 ? "vogla" : t.spots <= 6 ? "mesatare" : "medha";
  if (gs === p.groupSize && vibe.depth && (vibe.depth === p.depth || p.depth === "te-dyja"))
    parts.push(`Të dy preferoni grupe të ${gs === "vogla" ? "vogla" : gs === "mesatare" ? "mesme" : "mëdha"} dhe ${vibe.depth === "thella" ? "biseda të thella" : "atmosferë argëtuese"}.`);
  else if (gs === p.groupSize) parts.push(`Madhësia e grupit (${t.spots} vende) përputhet me preferencën tënde.`);
  if (vibe.time && vibe.time === p.time) parts.push("Ora e tavolinës përputhet me orarin kur del ti zakonisht.");
  if ((aff[t.cat] || 0) >= 6) parts.push("Ke dalë i kënaqur nga tavolina të ngjashme më parë — e kemi vënë re nga vlerësimet e tua.");
  if ((aff[t.cat] || 0) <= -6) parts.push("Vlerësimet e tua të kaluara tregojnë se kjo kategori s'të përshtatet aq — prandaj renditet më poshtë.");
  if (!parts.length) parts.push("Profilet tuaja kanë disa pika të përbashkëta bazë — gjuha, qyteti dhe hapja për njohje të reja.");
  return parts.join(" ");
};

/* ── Unaza e vendeve (elementi nënshkrim) ── */function SeatRing({ total, taken, size = 44 }) {
  const dots = [];
  const r = size / 2 - 4;
  for (let i = 0; i < total; i++) {
    const angle = (i / total) * Math.PI * 2 - Math.PI / 2;
    const x = size / 2 + r * Math.cos(angle);
    const y = size / 2 + r * Math.sin(angle);
    dots.push(
      <circle key={i} cx={x} cy={y} r={4}
        fill={i < taken ? "#244AA5" : "none"}
        stroke={i < taken ? "#244AA5" : "#E3A23C"}
        strokeWidth={i < taken ? 0 : 2} />
    );
  }
  return (
    <svg width={size} height={size} aria-label={`${taken} nga ${total} vende të zëna`}>
      <circle cx={size / 2} cy={size / 2} r={size / 5.5} fill="#F0E7D8" stroke="#D9CBB2" strokeWidth="1.5" />
      {dots}
    </svg>
  );
}

function Avatar({ name, photo, small, large }) {
  const cls = `avatar ${small ? "avatar-sm" : ""} ${large ? "avatar-lg" : ""}`;
  if (photo) return <img src={photo} alt={name} className={cls} style={{ objectFit: "cover" }} />;
  const hues = [217, 36, 152, 265, 12, 190];
  const h = hues[(name?.charCodeAt(0) || 0) % hues.length];
  return (
    <div className={cls} style={{ background: `hsl(${h} 55% 88%)`, color: `hsl(${h} 60% 32%)` }}>
      {name?.[0]?.toUpperCase() || "?"}
    </div>
  );
}

function Stars({ rating }) {
  return (
    <span className="stars" title={`${rating} / 5`}>
      ★ {rating.toFixed(1)}
    </span>
  );
}

const formatCardNum = (v) => v.replace(/\D/g, "").slice(0, 16).replace(/(\d{4})(?=\d)/g, "$1 ");
const formatExpiry = (v) => {
  const d = v.replace(/\D/g, "").slice(0, 4);
  return d.length > 2 ? d.slice(0, 2) + "/" + d.slice(2) : d;
};
const validCard = (c) => {
  const num = c.num.replace(/\s/g, "");
  const [mm, yy] = c.exp.split("/").map(Number);
  return num.length === 16 && c.name.trim().length >= 3 && mm >= 1 && mm <= 12 && yy >= 26 && c.cvc.replace(/\D/g, "").length === 3;
};

/* ── Distanca (Haversine) ── */
const distKm = (a, b) => {
  const R = 6371, toR = (x) => (x * Math.PI) / 180;
  const dLat = toR(b.lat - a.lat), dLng = toR(b.lng - a.lng);
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(toR(a.lat)) * Math.cos(toR(b.lat)) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
};

  const validatePhoto = (dataUrl) => new Promise((resolve) => {
    const img = new window.Image();
    img.onload = async () => {
      try {
        const c = document.createElement("canvas");
        const w = (c.width = Math.min(180, img.width));
        const h = (c.height = Math.min(180, img.height));
        const ctx = c.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        const d = ctx.getImageData(0, 0, w, h).data;
        let sum = 0, sum2 = 0, skin = 0;
        const n = d.length / 4;
        for (let i = 0; i < d.length; i += 4) {
          const r = d[i], g = d[i + 1], b = d[i + 2];
          const l = 0.299 * r + 0.587 * g + 0.114 * b;
          sum += l; sum2 += l * l;
          if (r > 60 && g > 35 && b > 25 && r > b && Math.abs(r - g) > 8) skin++;
        }
        const mean = sum / n;
        const sd = Math.sqrt(Math.max(0, sum2 / n - mean * mean));
        if (mean < 26) return resolve({ ok: false, reason: "Fotoja është shumë e errët — provo në dritë më të mirë. 🌑" });
        if (sd < 16) return resolve({ ok: false, reason: "Fotoja duket e njëtrajtshme (një ngjyrë) — duhet foto e vërtetë ku duket fytyra. 🎨" });
        if ("FaceDetector" in window) {

            return resolve({ ok: true, faceChecked: true });
          } catch (err) { /* bie te heuristika */ }
        }
        if (skin / n < 0.03) return resolve({ ok: false, reason: "Nuk u dallua fytyrë — zgjidh një foto ku fytyra jote duket qartë. 🙂" });
        resolve({ ok: true });
      } catch (err) { resolve({ ok: true }); }
    };
    img.onerror = () => resolve({ ok: false, reason: "Fotoja s'u lexua dot — provo një tjetër." });
    img.src = dataUrl;
  });

    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = img.width; c.height = img.height;
      const ctx = c.getContext("2d");
      ctx.translate(img.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(img, 0, 0);
      setUser((u) => ({ ...u, photo: c.toDataURL("image/jpeg", 0.92) }));
    };
    img.src = user.photo;
  };

  const createTable = () => {
    const ride = form.mode === "vozitje";
    const trip = form.mode === "udhetim";
    if (trip && !form.cafe.trim()) { showToast("Shkruaj destinacionin 🧳"); return; }
    if (!ride && !trip && !form.cafe.trim()) { showToast("Shkruaj emrin e vendit 📍"); return; }
    if (ride && form.city === form.toCity) { showToast("Zgjidh dy qytete të ndryshme 🚗"); return; }
    if (!form.time.trim()) { showToast(ride ? "Shkruaj kohën e nisjes 🕐" : "Shkruaj kohën e takimit 🕐"); return; }
    const id = Date.now();
    const newT = {
      id,
      cat: ride ? "vozitje" : trip ? "udhetim" : form.cat,
      cafe: ride ? `${form.city} → ${form.toCity}` : form.cafe.trim(),
      budget: trip ? (form.budget || "").trim() || undefined : undefined,
      area: ride ? `Nisja: ${form.area.trim() || "qendra"}` : trip ? `Nisja: ${form.city}` : (form.area.trim() || "Qendra"),
      city: form.city,
      host: user.name, hostAge: parseInt(user.age, 10) || undefined,
      hostFrom: user.isTourist ? `✈️ ${user.from || "Turist"}` : `🇽🇰 ${form.city}`,
      hostVerified: false, hostRating: 5.0, hostTables: 1,
      time: form.time.trim(), spots: Number(form.spots) || 4,
      joined: [user.name], requests: [],
      langs: form.langs.split(",").map((s) => s.trim()).filter(Boolean),
      tags: ride ? ["Vozitje e përbashkët", ...(form.womenOnly ? ["Vetëm femra"] : [])]
        : trip ? ["Udhëtim në grup", ...(form.womenOnly ? ["Vetëm femra"] : [])]
        : (form.womenOnly ? ["Vetëm femra"] : []),
      womenOnly: form.womenOnly,
      desc: form.desc.trim() || (ride ? "Ulëse të lira — për shoqëri rrugës!" : trip ? "Po kërkoj shoqëri për këtë udhëtim — hajde bashkohu!" : "Hajde bashkohu, të njihemi!"), chat: [],
      mapsLink: form.mapsLink.trim(),
    };
    setTables((p) => [newT, ...p]);
    awardBadge("first-host", "🪑", "Nikoqiri i ri");
    setCity(form.city); setTab("zbulo"); setShowCreate(false);
    setForm({ mode: "tavoline", city: form.city, toCity: form.toCity, budget: "", cafe: "", area: "", time: "", spots: 4, cat: "kafe", desc: "", langs: "Shqip, English", womenOnly: false, mapsLink: "" });
    showToast(ride ? "Vozitja u hap! Të njoftojmë kur dikush kërkon ulëse 🚗" : trip ? "Udhëtimi u hap! Të njoftojmë kur dikush kërkon të vijë 🧳" : "Tavolina u hap! Do të njoftohesh kur dikush kërkon të vijë 🔔");

    /* Simulim demo: brenda pak sekondash vijnë kërkesa reale që TI i shqyrton */
    if (!simulatedIncoming.current.has(id)) {
      simulatedIncoming.current.add(id);
      const [a, b] = [FAKE_REQUESTERS[Math.floor(Math.random() * 2)], FAKE_REQUESTERS[2 + Math.floor(Math.random() * 2)]];
      setTimeout(() => {
        setTables((prev) => prev.map((t) =>
          t.id === id ? { ...t, requests: [...(t.requests || []), { rid: id + 1, ...a, photo: null, status: "pending" }] } : t
        ));
        pushNotif(`${a.name}, ${a.age} (${a.from}) kërkon t'i bashkohet tavolinës tënde "${newT.cafe}". Shiko profilin dhe vendos.`, "🙋");
        pushNotif(`Njoftimi u dërgua edhe në email-in tënd: ${user.email}`, "📧");
        showToast(`🔔 Kërkesë e re — të erdhi edhe në email 📧`);
      }, 5000);
      setTimeout(() => {
        setTables((prev) => prev.map((t) =>
          t.id === id ? { ...t, requests: [...(t.requests || []), { rid: id + 2, ...b, photo: null, status: "pending" }] } : t
        ));
        pushNotif(`${b.name}, ${b.age} (${b.from}) kërkon t'i bashkohet tavolinës tënde "${newT.cafe}".`, "🙋");
        pushNotif(`Njoftimi u dërgua edhe në email-in tënd: ${user.email}`, "📧");
      }, 11000);
    }
  };

  /* ══════════ ONBOARDING — stili Timeleft: 1 pyetje për ekran ══════════ */
  if (screen === "onboard") {
    const totalSteps = 4;
    return (
      <div className={`app onboard ${step === 0 ? "hero-bg" : ""}`}>
        <Style />

        {/* ── EKRANI HERO ── */}
        {step === 0 && (
          <div className="hero">
            <div className="hero-art"><CityScape variant="prishtina" tone="dark" height={104} /></div>
            <div className="hero-ring">
              <SeatRing total={6} taken={4} size={92} />
            </div>
            <h1 className="logo-word hero-logo">hajde<span className="logo-bang">!</span></h1>
            <h2 className="hero-line">
              Sonte, dikush në qytet<br />ka një <em>karrige të lirë</em><br />për ty.
            </h2>
            <div className="hero-stats">
              <span>☕ Kafe · pishina · darka</span>
              <span>📍 38 komuna të Kosovës</span>
              <span>🛡️ Profile me foto · 18+</span>
            </div>
            <button className="btn hero-cta" onClick={() => setStep(1)}>Hajde, fillojmë →</button>
            <p className="hero-foot">Falas për të hyrë · Rezervimi {BOOKING_FEE.toFixed(2)} €</p>
          </div>
        )}

        {/* ── HAPAT: 1 pyetje për ekran ── */}
        {step > 0 && (
          <div className="ob-inner steps">
            <div className="steps-art"><CityScape variant="generic" tone="light" height={92} /></div>
            <div className="step-top">
              <button className="icon-btn" onClick={() => setStep(step - 1)} aria-label="Kthehu"><ChevronLeft size={18} /></button>
              <div className="dots">
                {Array.from({ length: totalSteps }).map((_, i) => (
                  <span key={i} className={`dot ${i < step ? "on" : ""}`} />
                ))}
              </div>
              <span className="step-n">{step}/{totalSteps}</span>
            </div>

            {step === 1 && (
              <div className="step-body">
                <p className="step-q">Si quhesh?</p>
                <input className="input xl" autoFocus placeholder="Emri" value={user.firstName}
                  onChange={(e) => setUser({ ...user, firstName: e.target.value })} />
                <input className="input xl" placeholder="Mbiemri" value={user.lastName}
                  onChange={(e) => setUser({ ...user, lastName: e.target.value })} />
                <input className="input xl" type="email" placeholder="Email-i yt" value={user.email}
                  onChange={(e) => setUser({ ...user, email: e.target.value })}
                  onKeyDown={(e) => e.key === "Enter" && user.firstName.trim() && user.lastName.trim() && emailValid && setStep(2)} />
                <p className="step-hint">📧 Në email të vijnë njoftimet e rëndësishme — p.sh. kur dikush kërkon t'i bashkohet tavolinës tënde, edhe kur s'e ke aplikacionin të hapur.</p>
                <button className="btn primary full big-cta"
                  disabled={!user.firstName.trim() || !user.lastName.trim() || !emailValid}
                  onClick={() => { setUser({ ...user, name: `${user.firstName.trim()} ${user.lastName.trim()}` }); setStep(2); }}>
                  Vazhdo
                </button>
              </div>
            )}

            {step === 2 && (() => {
              const a = parseInt(user.age, 10) || 24;
              const setA = (v) => setUser({ ...user, age: String(Math.max(18, Math.min(99, v))) });
              const caption =
                a < 25 ? "Energjia e viteve njëzet ✨" :
                a < 32 ? "Mosha e artë e tavolinave ☕" :
                a < 45 ? "Përvoja takon shoqërinë 🥂" :
                a < 60 ? "Historitë më të mira i ke ti 🍷" : "Kurrë s'është vonë për miq të rinj 🌟";
              return (
                <div className="step-body">
                  <p className="step-q">Sa vjeç je?</p>
                  <div className="age-stage">
                    <button className="age-btn" onClick={() => setA(a - 1)} disabled={a <= 18} aria-label="Zvogëlo">−</button>
                    <div className="age-big-wrap">
                      <span className="age-big">{a}</span>
                      <span className="age-unit">vjeç</span>
                    </div>
                    <button className="age-btn plus" onClick={() => setA(a + 1)} disabled={a >= 99} aria-label="Rrit">+</button>
                  </div>
                  <input type="range" min="18" max="80" value={Math.min(a, 80)} className="age-slider"
                    onChange={(e) => setA(Number(e.target.value))} aria-label="Zgjidh moshën" />
                  <div className="age-scale"><span>18</span><span>30</span><span>45</span><span>60</span><span>80+</span></div>
                  <p className="age-caption">{caption}</p>
                  <button className="btn primary full big-cta" onClick={() => setStep(3)}>Vazhdo</button>
                  <p className="step-hint center">Hajde! është vetëm për moshën 18+ 🛡️</p>
                </div>
              );
            })()}

            {step === 3 && (
              <div className="step-body">
                <p className="step-q">Një foto ku dukesh qartë 📸</p>
                <div className="photo-zone">
                  {user.photo
                    ? <img src={user.photo} alt="Fotoja jote" className="photo-preview xl-photo" />
                    : <button className="photo-preview xl-photo empty" onClick={() => fileRef.current?.click()} aria-label="Shto foto">
                        <Camera size={34} />
                      </button>}
                  <input ref={fileRef} type="file" accept="image/*" capture="user" hidden onChange={onPhotoPick} />
                  <div className="photo-actions">
                    <button className="btn ghost" onClick={() => fileRef.current?.click()}>
                      <Camera size={16} /> {user.photo ? "Ndrysho foton" : "Bëj / zgjidh një foto"}
                    </button>
                    {user.photo && (
                      <button className="btn ghost" onClick={flipPhoto} title="Pasqyroje foton">
                        <FlipHorizontal size={16} /> Ktheje anën
                      </button>
                    )}
                  </div>
                </div>
                {photoError && <p className="age-warn">{photoError}</p>}
                <p className="step-hint">Fotoja kontrollohet automatikisht — duhet të tregojë <b>fytyrë reale</b> (jo e zezë, jo një ngjyrë). U tregohet vetëm nikoqirëve.{user.photo ? " Duket e kthyer mbrapsht? Prek \"Ktheje anën\"." : ""}</p>
                <button className="btn primary full big-cta" disabled={!user.photo} onClick={() => setStep(4)}>Vazhdo</button>
              </div>
            )}

            {step === 4 && (
              <div className="step-body">
                <p className="step-q">Je vendas apo mysafir?</p>
                <div className="ob-choice">
                  <button className={`choice big ${user.isTourist === false ? "on" : ""}`}
                    onClick={() => { setUser({ ...user, isTourist: false }); setScreen("main"); setTimeout(() => setShowMQ(true), 600); }}>
                    <span className="choice-emoji">🇽🇰</span>Jam nga Kosova
                  </button>
                  <button className={`choice big ${user.isTourist === true ? "on" : ""}`}
                    onClick={() => setUser({ ...user, isTourist: true })}>
                    <span className="choice-emoji">✈️</span>Jam turist / mysafir
                  </button>
                </div>
                {user.isTourist && (
                  <>
                    <input className="input xl" autoFocus placeholder="Prej nga vjen? (p.sh. Berlin)" value={user.from}
                      onChange={(e) => setUser({ ...user, from: e.target.value })}
                      onKeyDown={(e) => e.key === "Enter" && setScreen("main")} />
                    <button className="btn primary full big-cta" onClick={() => { setScreen("main"); setTimeout(() => setShowMQ(true), 600); }}>Hajde, fillojmë! 🎉</button>
                  </>
                )}
              </div>
            )}
          </div>
        )}
      </div>
    );
  }

  /* ══════════ APLIKACIONI KRYESOR ══════════ */
  return (
    <div className="app">
      <Style />

      <header className="hdr">
        <div className="hdr-art"><CityScape variant={cityVariant(city)} tone="light" height={64} /></div>
        <div className="hdr-top">
          <h1 className="logo-word sm">hajde<span className="logo-bang">!</span></h1>
          <div className="hdr-right">
            <button className="bell" onClick={() => { setShowNotifs((s) => !s); setUnread(0); }} aria-label="Njoftimet">
              <Bell size={19} />
              {unread > 0 && <em className="bell-badge">{unread}</em>}
            </button>
            <div className="hdr-user">
              <Avatar name={user.name} photo={user.photo} small />
              <span>{user.firstName}{user.age ? `, ${user.age}` : ""}</span>
            </div>
          </div>
        </div>
        <div className="city-row">
          {CITIES.map((c) => (
            <button key={c} className={`chip city ${city === c ? "on" : ""}`} onClick={() => setCity(c)}>{c}</button>
          ))}
        </div>

        {showNotifs && (
          <div className="notif-panel">
            <div className="notif-hdr">
              <strong>Njoftimet</strong>
              <span className="notif-actions">
                {notifs.length > 0 && <button className="notif-clear" onClick={() => setNotifs([])}>Pastro</button>}
                <button className="clear" onClick={() => setShowNotifs(false)}><X size={13} /></button>
              </span>
            </div>
            <p className="email-line">📧 Çdo kërkesë e re të dërgohet edhe në email: <strong>{user.email || "—"}</strong></p>
            {notifs.length === 0 && <p className="muted small pad">S'ka njoftime ende. Kur dikush kërkon t'i bashkohet tavolinës tënde, e sheh këtu dhe në email. 🔔</p>}
            {notifs.map((n) => (
              <div key={n.id} className="notif-item">
                <span className="notif-icon">{n.icon}</span>
                <p>{n.text}</p>
                <em>{n.time}</em>
              </div>
            ))}
          </div>
        )}
      </header>

      <main className="content">
        {tab === "zbulo" && (
          <>
            {!profile.done && (
              <button className="mq-banner" onClick={() => setShowMQ(true)}>
                <span className="mq-emoji">✨</span>
                <span className="mq-txt"><strong>Trego shijet e tua</strong> — 15 pyetje të shpejta dhe tavolinat renditen sipas përshtatjes me ty</span>
                <span className="wed-cta">Fillo →</span>
              </button>
            )}
            {!wedDone && city === "Prishtinë" && (
              <button className="wed-banner" onClick={() => setShowWed(true)}>
                <div className="wed-left">
                  <span className="wed-kicker">✦ DARKA E SË MËRKURËS</span>
                  <strong>6 të panjohur. 1 restorant sekret.</strong>
                  <span className="wed-sub">Kuiz 2-minutësh → të përputhim me njerëz si ti</span>
                </div>
                <span className="wed-cta">Fillo →</span>
              </button>
            )}
            <div className="search">
              <Search size={16} />
              <input placeholder="Kërko kafe, aktivitet…" value={query} onChange={(e) => setQuery(e.target.value)} />
              {query && <button className="clear" onClick={() => setQuery("")} aria-label="Pastro"><X size={14} /></button>}
            </div>
            <div className="cat-row">
              <button className={`chip ${cat === "all" ? "on" : ""}`} onClick={() => setCat("all")}>
                <Sparkles size={14} /> Të gjitha
              </button>
              {CATEGORIES.map((c) => {
                const I = c.icon;
                return (
                  <button key={c.id} className={`chip ${cat === c.id ? "on" : ""}`} onClick={() => setCat(c.id)}>
                    <I size={14} /> {c.label}
                  </button>
                );
              })}
            </div>

            <p className="count">{filtered.length} tavolina të hapura në {city}</p>

            {filtered.length === 0 && (
              <div className="empty">
                <SeatRing total={5} taken={0} size={56} />
                <p><strong>Ende s'ka tavolina këtu.</strong></p>
                <p className="muted">Bëhu i pari — hap një tavolinë dhe të tjerët do të kërkojnë të vijnë.</p>
                <button className="btn primary" onClick={openCreate}><Plus size={16} /> {createLabel}</button>
              </div>
            )}

            <div className="cards">
              {filtered.map((t, idx) => {
                const st = myStatus(t);
                const m = t._match;
                const mCls = m == null ? "" : m >= 85 ? "hot" : m >= 70 ? "warm" : "cool";
                return (
                  <article key={t.id} className={`card ${idx === 0 && m >= 85 ? "rec" : ""}`} onClick={() => setActive(t.id)}>
                    {idx === 0 && m >= 85 && <span className="rec-ribbon">⭐ Rekomanduar për ty</span>}
                    <div className="card-left">
                      <SeatRing total={t.spots} taken={t.joined.length} />
                      <span className={`seats-label ${st === "full" ? "full" : ""}`}>
                        {st === "full" ? "Plot" : `${t.spots - t.joined.length} vende`}
                      </span>
                      {m != null && <span className={`match-pill ${mCls}`}>{m >= 85 ? "🔥 " : ""}{m}%</span>}
                    </div>
                    <div className="card-body">
                      <div className="card-top">
                        <h3>{t.cafe}</h3>
                        {st === "joined" && <span className="badge joined"><Check size={12} /> Rezervuar</span>}
                        {st === "pending" && <span className="badge pending"><Hourglass size={11} /> Në pritje</span>}
                        {st === "waitlist" && <span className="badge pending"><BellRing size={11} /> Listë pritjeje</span>}
                        {st === "approved" && <span className="badge approved">✓ Aprovuar — paguaj</span>}
                        {st === "host" && <span className="badge hosting">Nikoqir{(t.requests || []).filter(r=>r.status==="pending").length > 0 ? ` · ${t.requests.filter(r=>r.status==="pending").length} kërkesa` : ""}</span>}
                      </div>
                      <p className="meta"><MapPin size={13} /> {t.area} · <Clock size={13} /> {t.time}
                        {userPos && t.coords && <> · <Navigation size={12} /> {distKm(userPos, t.coords).toFixed(1)} km</>}
                      </p>
                      {t.womenOnly && <span className="badge women">💛 Vetëm femra</span>}
                      {isRide(t) && <span className="badge ride">🚗 Vozitje e përbashkët · falas</span>}
                      {t.cat === "udhetim" && <span className="badge trip">🧳 {t.budget || "Udhëtim në grup"}</span>}
                      <p className="desc">{t.desc}</p>
                      <div className="card-foot">
                        <span className="host" onClick={(e) => { e.stopPropagation(); setProfileView(hostProf(t)); }} role="button" title="Shiko profilin">
                          <Avatar name={t.host} small /> {t.host}
                          {t.hostVerified && <BadgeCheck size={14} className="verified" />}
                          <Stars rating={t.hostRating} />
                        </span>
                        <span className="langs"><Globe size={12} /> {t.langs.join(" · ")}</span>
                      </div>
                    </div>
                  </article>
                );
              })}
            </div>
          </>
        )}

        {tab === "imet" && (
          <>
            {badges.length > 0 && (
              <div className="conn-strip">
                <p className="label">Distinktivat e mia 🏅</p>
                <div className="badge-row">
                  {badges.map((b) => (
                    <span key={b.id} className="badge-chip">{b.emoji} {b.label}</span>
                  ))}
                </div>
              </div>
            )}
            {connections.length > 0 && (
              <div className="conn-strip">
                <p className="label">Lidhjet e mia 💫</p>
                <div className="conn-list">
                  {connections.map((n) => (
                    <button key={n} className="conn-chip" onClick={() => setProfileView(liteProf(n))}>
                      <Avatar name={n} /> <span>{n.split(" ")[0]}</span>
                    </button>
                  ))}
                </div>
              </div>
            )}
            <h2 className="section-title">Tavolinat e mia</h2>
            {myTables.length === 0 ? (
              <div className="empty">
                <SeatRing total={4} taken={1} size={56} />
                <p><strong>S'je ulur askund ende.</strong></p>
                <p className="muted">Shko te "Zbulo" dhe kërko t'i bashkohesh një tavoline — ose hap tënden falas.</p>
                <button className="btn ghost" onClick={() => setTab("zbulo")}>Zbulo tavolina</button>
              </div>
            ) : (
              <div className="cards">
                {myTables.map((t) => {
                  const st = myStatus(t);
                  const pend = (t.requests || []).filter((r) => r.status === "pending").length;
                  return (
                    <article key={t.id} className="card slim" onClick={() => setActive(t.id)}>
                      <SeatRing total={t.spots} taken={t.joined.length} size={40} />
                      <div className="card-body">
                        <h3>{t.cafe} <span className="muted small">· {t.city}</span></h3>
                        <p className="meta"><Clock size={13} /> {t.time} · <Users size={13} /> {t.joined.length}/{t.spots}</p>
                        {st === "host" && <span className="badge hosting">Nikoqir{pend > 0 ? ` · ${pend} kërkesa të reja 🔔` : ""}</span>}
                        {st === "pending" && <span className="badge pending"><Hourglass size={11} /> Në pritje të aprovimit</span>}
                        {st === "approved" && <span className="badge approved">✓ Aprovuar — konfirmo me pagesë</span>}
                        {tickets[t.id] && <span className="badge ticket-mini"><Ticket size={11} /> {tickets[t.id]}</span>}
                        {st === "joined" && !rated[t.id] && (
                          <button className="rate-btn" onClick={(e) => { e.stopPropagation(); setRateFor(t.id); }}>
                            <Star size={12} /> Vlerëso përvojën
                          </button>
                        )}
                        {rated[t.id] && <span className="badge joined">★ E vlerësuar ({rated[t.id]}/5)</span>}
                      </div>
                      {t.chat.length > 0 && st === "joined" && <span className="chat-dot">{t.chat.length}</span>}
                    </article>
                  );
                })}
              </div>
            )}
          </>
        )}
      </main>

      <button className="fab" onClick={openCreate} aria-label={createLabel}>
        <Plus size={22} /> {cat === "vozitje" ? "🚗 " : cat === "udhetim" ? "🧳 " : ""}{createLabel}
      </button>

      <nav className="nav">
        <button className={tab === "zbulo" ? "on" : ""} onClick={() => setTab("zbulo")}>
          <Coffee size={20} /><span>Zbulo</span>
        </button>
        <button className={tab === "imet" ? "on" : ""} onClick={() => setTab("imet")}>
          <Users size={20} /><span>Tavolinat e mia</span>
          {(myTables.length > 0 || pendingRequestsForMe > 0) && (
            <em className="nav-count">{pendingRequestsForMe > 0 ? pendingRequestsForMe : myTables.length}</em>
          )}
        </button>
      </nav>

      {/* ══════════ DETAJI I TAVOLINËS ══════════ */}
      {activeTable && !payFor && (() => {
        const st = myStatus(activeTable);
        const pendingReqs = (activeTable.requests || []).filter((r) => r.status === "pending");
        return (
          <div className="sheet-wrap" onClick={() => setActive(null)}>
            <div className="sheet" onClick={(e) => e.stopPropagation()}>
              <div className="sheet-art"><CityScape variant={cityVariant(activeTable.city)} tone="light" height={66} /></div>
              <div className="sheet-hdr">
                <button className="icon-btn" onClick={() => setActive(null)} aria-label="Mbyll"><ChevronLeft size={20} /></button>
                <div>
                  <h2>{activeTable.cafe}</h2>
                  <p className="meta"><MapPin size={13} /> {activeTable.area}, {activeTable.city} · <Clock size={13} /> {activeTable.time}</p>
                </div>
                <SeatRing total={activeTable.spots} taken={activeTable.joined.length} size={48} />
              </div>

              {/* ── RESTORANTI SEKRET (Darka e së Mërkurës) ── */}
              {activeTable.mystery && !activeTable.revealed && (
                <div className="lock-card">
                  <Lock size={18} />
                  <div>
                    <strong>Restoranti mbahet sekret 🤫</strong>
                    <span>Zbulohet të mërkurën në 09:00 — 24 orë para darkës. Kështu askush s'anulon në momentin e fundit.</span>
                  </div>
                  <button className="btn ghost btn-sm" onClick={() => revealVenue(activeTable.id)}>⚡ Zbulo tani (demo)</button>
                </div>
              )}

              {/* ── LOKACIONI ── */}
              {(!activeTable.mystery || activeTable.revealed) && (
              <div className="loc-row">
                <div className="loc-info">
                  <Navigation size={15} />
                  {posState === "ok" && userPos && activeTable.coords
                    ? <span><strong>{distKm(userPos, activeTable.coords).toFixed(1)} km</strong> larg teje</span>
                    : posState === "asking"
                      ? <span className="muted">Duke gjetur lokacionin tënd…</span>
                      : posState === "denied"
                        ? <span className="muted">Lokacioni s'u lejua — përdor hartën</span>
                        : <button className="loc-link" onClick={askLocation}>Sa larg është nga unë?</button>}
                </div>
                <a className="btn ghost btn-sm" href={mapsUrl(activeTable)} target="_blank" rel="noopener noreferrer">
                  <MapPin size={14} /> Hape në hartë
                </a>
              </div>
              )}

              {/* Bileta */}
              {tickets[activeTable.id] && (
                <div className="ticket">
                  <div className="ticket-left">
                    <Ticket size={22} />
                    <div><strong>Bileta jote</strong><span className="ticket-code">{tickets[activeTable.id]}</span></div>
                  </div>
                  <span className="ticket-note">Trego kodin te tavolina</span>
                </div>
              )}

              {/* ── KËRKESAT (vetëm kur TI je nikoqiri) ── */}
              {st === "host" && (
                <div className="requests">
                  <p className="label">Kërkesat për t'u bashkuar ({pendingReqs.length})</p>
                  {pendingReqs.length === 0 ? (
                    <p className="muted small">S'ka kërkesa të reja. Kur dikush kërkon të vijë, e sheh këtu me foto e moshë — dhe vendos ti. 🔔</p>
                  ) : pendingReqs.map((r) => (
                    <div key={r.rid} className="req-card" onClick={() => setProfileView({ name: r.name, age: r.age, from: r.from, photo: r.photo })} role="button" title="Shiko profilin e plotë">
                      <Avatar name={r.name} photo={r.photo} large />
                      <div className="req-info">
                        <strong>{r.name}, {r.age}</strong>
                        <span className="muted small">{r.from}</span>
                      </div>
                      <div className="req-actions">
                        <button className="btn-approve" onClick={(e) => { e.stopPropagation(); approveRequest(activeTable.id, r.rid); }} aria-label={`Prano ${r.name}`}>
                          <UserCheck size={16} /> Prano
                        </button>
                        <button className="btn-reject" onClick={(e) => { e.stopPropagation(); rejectRequest(activeTable.id, r.rid); }} aria-label={`Refuzo ${r.name}`}>
                          <UserX size={16} />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {/* Nikoqiri */}
              <div className="host-box" onClick={() => setProfileView(hostProf(activeTable))} role="button" title="Shiko profilin">
                <Avatar name={activeTable.host} />
                <div className="host-info">
                  <strong>
                    {activeTable.host}{activeTable.hostAge ? `, ${activeTable.hostAge}` : ""}
                    {activeTable.hostVerified && <BadgeCheck size={15} className="verified" />}
                  </strong>
                  <span className="muted small">{activeTable.hostFrom} · {activeTable.hostTables} tavolina të mbajtura</span>
                </div>
                <Stars rating={activeTable.hostRating} />
              </div>

              {profile.done && st !== "host" && (() => {
                const m = matchScore(activeTable, profile, aff);
                return (
                  <div className="why-box">
                    <div className="why-score">
                      <strong>{m}%</strong>
                      <span>përputhje</span>
                    </div>
                    <div className="why-txt">
                      <p className="why-title">Pse po ta rekomandojmë?</p>
                      <p>{explainMatch(activeTable, profile, aff)}</p>
                    </div>
                  </div>
                );
              })()}

              <p className="sheet-desc">{activeTable.desc}</p>

              {(activeTable.tags || []).length > 0 && (
                <div className="tags">{activeTable.tags.map((tg) => <span key={tg} className="tag">{tg}</span>)}</div>
              )}

              <div className="people">
                <p className="label">Kush është te tavolina ({activeTable.joined.length}/{activeTable.spots})</p>
                <div className="people-row">
                  {activeTable.joined.map((n) => (
                    <div key={n} className="person" onClick={() => setProfileView(n === activeTable.host ? hostProf(activeTable) : liteProf(n))} role="button">
                      <Avatar name={n} photo={n === user.name ? user.photo : null} />
                      <span>{n === user.name ? "Ti" : n.split(" ")[0]}{n === activeTable.host && <em> · nikoqir</em>}</span>
                    </div>
                  ))}
                  {Array.from({ length: Math.max(0, activeTable.spots - activeTable.joined.length) }).map((_, i) => (
                    <div key={i} className="person free"><div className="avatar dashed">?</div><span>i lirë</span></div>
                  ))}
                </div>
              </div>

              {/* ── Butoni sipas statusit ── */}
              {st === "none" && (
                <>
                  <button className="btn full primary" onClick={() => requestJoin(activeTable.id)}>
                    Kërko t'i bashkohesh (falas)
                  </button>
                  <p className="fee-note"><ShieldCheck size={11} /> {activeTable.host} sheh foton, emrin dhe moshën tënde para se të vendosë.{isRide(activeTable) ? " Vozitja është plotësisht falas." : ` Paguan ${tableFee(activeTable).toFixed(2)} € vetëm pasi të aprovohesh.`}</p>
                </>
              )}
              {st === "pending" && (
                <>
                  <button className="btn full ghost" disabled>
                    <Hourglass size={15} /> Në pritje — {activeTable.host} po e shikon profilin tënd…
                  </button>
                  <button className="link-btn" onClick={() => cancelRequest(activeTable.id)}>Anulo kërkesën</button>
                </>
              )}
              {st === "approved" && (
                <>
                  {isRide(activeTable) ? (
                    <button className="btn full primary glow" onClick={() => confirmFreeSeat(activeTable.id)}>
                      ✓ U aprovove! Konfirmo ulësen — falas 🚗
                    </button>
                  ) : (
                    <button className="btn full primary glow" onClick={() => startPayment(activeTable.id)}>
                      ✓ U aprovove! Konfirmo vendin · {tableFee(activeTable).toFixed(2)} €
                    </button>
                  )}
                  <p className="fee-note"><Lock size={11} /> Pagesa është përfundimtare — nuk rimbursohet nëse anulon. Paguaj vetëm nëse je i sigurt që vjen.</p>
                </>
              )}
              {st === "joined" && (
                <>
                  <button className="btn full safety" onClick={() => sharePlan(activeTable)}>
                    <Share2 size={15} /> Ndaje planin me një mik
                  </button>
                  <button className="btn full ghost" onClick={() => leaveTable(activeTable.id)}>
                    {isRide(activeTable) ? "Largohu nga vozitja" : "Largohu nga tavolina (pa rimbursim)"}
                  </button>
                </>
              )}
              {st === "full" && (
                <>
                  <button className="btn full primary" onClick={() => joinWaitlist(activeTable.id)}>
                    <BellRing size={16} /> Futu në listën e pritjes
                  </button>
                  <p className="fee-note">Tavolina është plot — të njoftojmë menjëherë sapo dikush të anulojë. Pa pagesë derisa të lirohet vendi.</p>
                </>
              )}
              {st === "waitlist" && (
                <>
                  <button className="btn full ghost" disabled><Hourglass size={15} /> Në listë pritjeje — i pari në radhë</button>
                  <button className="link-btn" onClick={() => leaveWaitlist(activeTable.id)}>Dil nga lista</button>
                </>
              )}
              {st === "host" && <button className="btn full ghost" disabled>Je nikoqiri i kësaj tavoline</button>}

              {/* Chat */}
              <div className="chat">
                <div className="chat-top">
                  <p className="label">Biseda e tavolinës</p>
                  {(st === "joined" || st === "host") && (
                    <span className="lang-hint"><Languages size={13} /> Përkthim automatik</span>
                  )}
                </div>
                {(st === "joined" || st === "host") ? (
                  <>
                    <div className="chat-msgs">
                      {activeTable.chat.length === 0 && <p className="muted small center">Ende heshtje… thuaj diçka të parën! 👋</p>}
                      {activeTable.chat.map((m, i) => {
                        const tKey = `${activeTable.id}-${i}`;
                        const tr = translations[tKey];
                        return (
                        <div key={i} className={`bubble ${m.from === user.name ? "mine" : ""}`}>
                          {m.from !== user.name && <strong>{m.from}</strong>}
                          <span>{m.text}</span>
                          {tr && tr !== "…" && <span className="trans-out">🌐 {tr}</span>}
                          {tr === "…" && <span className="trans-out">🌐 duke përkthyer…</span>}
                          <span className="bubble-foot">
                            {m.from !== user.name && !tr && (
                              <button className="trans-btn" onClick={() => translateMsg(activeTable.id, i, m.text)}>🌐 Përkthe</button>
                            )}
                            <em>{m.time}</em>
                          </span>
                        </div>
                        );
                      })}
                      <div ref={chatEndRef} />
                    </div>
                    <div className="chat-input">
                      <button className="icon-btn dice" onClick={throwIcebreaker} title="Merr një pyetje për fillim bisede" aria-label="Pyetje për fillim bisede">
                        <Dice5 size={17} />
                      </button>
                      <input placeholder="Shkruaj mesazh…" value={msg}
                        onChange={(e) => setMsg(e.target.value)}
                        onKeyDown={(e) => e.key === "Enter" && sendMsg()} />
                      <button className={`icon-btn trans ${draftTranslating ? "busy" : ""}`} onClick={translateDraft}
                        disabled={!msg.trim() || draftTranslating}
                        title="Përktheje atë që shkrove" aria-label="Përktheje mesazhin tënd">
                        <Languages size={16} />
                      </button>
                      <button className="icon-btn send" onClick={() => sendMsg()} aria-label="Dërgo"><Send size={16} /></button>
                    </div>
                  </>
                ) : (
                  <p className="muted small">🔒 Biseda hapet pasi të aprovohesh dhe ta konfirmosh vendin.</p>
                )}
              </div>
            </div>
          </div>
        );
      })()}

      {/* ══════════ FLETA E PAGESËS ══════════ */}
      {payFor && payTable && (
        <div className="sheet-wrap" onClick={() => payState !== "processing" && closePayment(false)}>
          <div className="sheet pay" onClick={(e) => e.stopPropagation()}>
            {payState === "success" ? (
              <div className="pay-success">
                <div className="success-ring"><PartyPopper size={34} /></div>
                <h2>Vendi u konfirmua!</h2>
                <p className="muted">Shihemi te <strong>{payTable.cafe}</strong>, {payTable.time.toLowerCase()}.</p>
                <div className="ticket big">
                  <div className="ticket-left">
                    <Ticket size={26} />
                    <div><strong>Bileta jote</strong><span className="ticket-code">{tickets[payFor]}</span></div>
                  </div>
                  <span className="ticket-note">Trego kodin<br />te tavolina</span>
                </div>
                <button className="btn primary full" onClick={() => closePayment(true)}>Shko te tavolina 🪑</button>
              </div>
            ) : (
              <>
                <div className="sheet-hdr">
                  <button className="icon-btn" onClick={() => closePayment(false)} disabled={payState === "processing"} aria-label="Mbyll"><X size={18} /></button>
                  <div><h2>Konfirmo vendin</h2><p className="meta">{payTable.cafe} · {payTable.time}</p></div>
                  <SeatRing total={payTable.spots} taken={payTable.joined.length} size={44} />
                </div>

                <div className="pay-summary">
                  <div className="pay-row"><span>{isRide(payTable) ? "Ulësja në vozitje (e aprovuar ✓)" : "Rezervimi i vendit (i aprovuar ✓)"}</span><span>{tableFee(payTable).toFixed(2)} €</span></div>
                  <div className="pay-row muted small"><span>{isRide(payTable) ? "Paguhet direkt — pa kosto shtesë rrugës" : "Kafeja / pijet paguhen në vend"}</span><span>—</span></div>
                  <div className="pay-row total"><span>Gjithsej tani</span><span>{tableFee(payTable).toFixed(2)} €</span></div>
                </div>

                <p className="label">Mënyra e pagesës</p>
                <div className="pay-methods">
                  <button className={`method ${payMethod === "card" ? "on" : ""}`} onClick={() => setPayMethod("card")}>
                    <CreditCard size={18} /> Kartelë
                  </button>
                  <button className={`method ${payMethod === "paypal" ? "on" : ""}`} onClick={() => setPayMethod("paypal")}>
                    <Wallet size={18} /> PayPal
                  </button>
                </div>

                {payMethod === "card" && (
                  <div className="card-form">
                    <input className="input" placeholder="Numri i kartelës" inputMode="numeric"
                      value={card.num} onChange={(e) => setCard({ ...card, num: formatCardNum(e.target.value) })} />
                    <div className="card-grid">
                      <input className="input" placeholder="MM/VV" inputMode="numeric"
                        value={card.exp} onChange={(e) => setCard({ ...card, exp: formatExpiry(e.target.value) })} />
                      <input className="input" placeholder="CVC" inputMode="numeric" maxLength={3}
                        value={card.cvc} onChange={(e) => setCard({ ...card, cvc: e.target.value.replace(/\D/g, "") })} />
                    </div>
                    <input className="input" placeholder="Emri në kartelë"
                      value={card.name} onChange={(e) => setCard({ ...card, name: e.target.value })} />
                  </div>
                )}
                {payMethod === "paypal" && (
                  <p className="muted small paypal-note">Do të ridrejtohesh te PayPal për të përfunduar pagesën.</p>
                )}

                <button className="btn primary full"
                  disabled={payState === "processing" || (payMethod === "card" && !validCard(card))}
                  onClick={confirmPayment}>
                  {payState === "processing"
                    ? <span className="spinner" aria-label="Duke u procesuar" />
                    : `Paguaj ${tableFee(payTable).toFixed(2)} € dhe konfirmo`}
                </button>
                <p className="fee-note"><Lock size={11} /> Pagesë e sigurt · Përfundimtare — pa rimbursim pas konfirmimit</p>
              </>
            )}
          </div>
        </div>
      )}

      {/* ══════════ KRIJO TAVOLINË ══════════ */}
      {showCreate && (
        <div className="sheet-wrap" onClick={() => setShowCreate(false)}>
          <div className="sheet" onClick={(e) => e.stopPropagation()}>
            <div className="sheet-hdr">
              <button className="icon-btn" onClick={() => setShowCreate(false)} aria-label="Mbyll"><X size={18} /></button>
              <div><h2>{form.mode === "vozitje" ? "Hap një vozitje" : form.mode === "udhetim" ? "Hap një udhëtim" : "Hap një tavolinë"}</h2><p className="meta">falas për {form.mode === "vozitje" ? "shoferin" : form.mode === "udhetim" ? "organizatorin" : "nikoqirin"} · ti i aprovon të gjithë</p></div>
              <SeatRing total={Number(form.spots) || 4} taken={1} size={48} />
            </div>

            <div className="mode-toggle">
              <button className={`mode-btn ${form.mode === "tavoline" ? "on" : ""}`}
                onClick={() => setForm({ ...form, mode: "tavoline", spots: 4 })}>🪑 Tavolinë</button>
              <button className={`mode-btn ${form.mode === "vozitje" ? "on" : ""}`}
                onClick={() => setForm({ ...form, mode: "vozitje", spots: 3 })}>🚗 Vozitje</button>
              <button className={`mode-btn ${form.mode === "udhetim" ? "on" : ""}`}
                onClick={() => setForm({ ...form, mode: "udhetim", spots: 5 })}>🧳 Udhëtim</button>
            </div>

            <label className="f-label" htmlFor="f-city">{form.mode === "vozitje" ? "Nga *" : form.mode === "udhetim" ? "Nisja nga *" : "Qyteti / Komuna *"}</label>
            <select id="f-city" className="input select" value={form.city}
              onChange={(e) => setForm({ ...form, city: e.target.value })}>
              {CITIES.map((c) => <option key={c} value={c}>{c}</option>)}
            </select>

            {form.mode === "vozitje" && (
              <>
                <label className="f-label" htmlFor="f-tocity">Deri *</label>
                <select id="f-tocity" className="input select" value={form.toCity}
                  onChange={(e) => setForm({ ...form, toCity: e.target.value })}>
                  {CITIES.map((c) => <option key={c} value={c}>{c}</option>)}
                </select>
                <label className="f-label" htmlFor="f-pickup">Pika e nisjes</label>
                <input id="f-pickup" className="input" placeholder="p.sh. te Katedralja" value={form.area}
                  onChange={(e) => setForm({ ...form, area: e.target.value })} />
                <p className="free-note">🚗 Vozitjet në Hajde! janë plotësisht falas — për shoqëri rrugës, jo për fitim.</p>
              </>
            )}
            {form.mode === "udhetim" && (
              <>
                <label className="f-label" htmlFor="f-dest">Destinacioni *</label>
                <input id="f-dest" className="input" placeholder="p.sh. Ksamil, Shqipëri" value={form.cafe}
                  onChange={(e) => setForm({ ...form, cafe: e.target.value })} />
                <label className="f-label" htmlFor="f-budget">Buxheti i përafërt (opsionale)</label>
                <input id="f-budget" className="input" placeholder="p.sh. ~120 € / person" value={form.budget || ""}
                  onChange={(e) => setForm({ ...form, budget: e.target.value })} />
              </>
            )}
            {form.mode === "tavoline" && (
              <>
                <label className="f-label" htmlFor="f-cafe">Ku? *</label>
                <input id="f-cafe" className="input" placeholder="p.sh. Soma Book Station" value={form.cafe}
                  onChange={(e) => setForm({ ...form, cafe: e.target.value })} />
                <label className="f-label" htmlFor="f-area">Lagjja / zona</label>
                <input id="f-area" className="input" placeholder="p.sh. Qendra" value={form.area}
                  onChange={(e) => setForm({ ...form, area: e.target.value })} />
              </>
            )}

            <label className="f-label" htmlFor="f-maps">Linku i Google Maps (opsionale, por i saktë 🎯)</label>
            <input id="f-maps" className="input" placeholder="Ngjite linkun e vendit nga Google Maps" value={form.mapsLink}
              onChange={(e) => setForm({ ...form, mapsLink: e.target.value })} />

            <label className="f-label" htmlFor="f-time">{form.mode === "vozitje" ? "Nisja kur? *" : form.mode === "udhetim" ? "Datat? * (p.sh. 12–14 gusht)" : "Kur? *"}</label>
            <input id="f-time" className="input" placeholder="p.sh. Sot, 18:00" value={form.time}
              onChange={(e) => setForm({ ...form, time: e.target.value })} />

            {form.mode === "tavoline" && (<>
            <label className="f-label">Lloji</label>
            <div className="cat-row wrap">
              {CATEGORIES.filter((c) => c.id !== "vozitje").map((c) => {
                const I = c.icon;
                return (
                  <button key={c.id} className={`chip ${form.cat === c.id ? "on" : ""}`}
                    onClick={() => setForm({ ...form, cat: c.id })}>
                    <I size={14} /> {c.label}
                  </button>
                );
              })}
            </div>

            </>)}

            <label className="f-label">{form.mode === "vozitje" ? `Sa ulëse të lira? (${form.spots})` : form.mode === "udhetim" ? `Sa persona kërkon? (${form.spots})` : `Sa vende gjithsej? (${form.spots})`}</label>
            <input type="range" min={form.mode === "vozitje" ? 1 : 2} max={form.mode === "vozitje" ? 4 : 10} value={form.spots} className="range"
              onChange={(e) => setForm({ ...form, spots: e.target.value })} />

            <label className="f-label" htmlFor="f-langs">Gjuhët</label>
            <input id="f-langs" className="input" value={form.langs}
              onChange={(e) => setForm({ ...form, langs: e.target.value })} />

            <label className="toggle-row">
              <input type="checkbox" checked={form.womenOnly}
                onChange={(e) => setForm({ ...form, womenOnly: e.target.checked })} />
              <span>💛 Tavolinë vetëm për femra</span>
            </label>

            <label className="f-label" htmlFor="f-desc">Përshkrimi</label>
            <textarea id="f-desc" className="input" rows={3} placeholder="Çka do të bëni? Kush është i mirëpritur?"
              value={form.desc} onChange={(e) => setForm({ ...form, desc: e.target.value })} />

            <button className="btn primary full" onClick={createTable}>{form.mode === "vozitje" ? "Hape vozitjen 🚗" : form.mode === "udhetim" ? "Hape udhëtimin 🧳" : "Hape tavolinën 🪑"}</button>
            <p className="fee-note"><ShieldCheck size={11} /> Çdo kërkesë të vjen me foto + moshë — vendos ti kush {form.mode === "vozitje" ? "hipën. Vozitjet janë plotësisht falas." : `ulet. Pjesëmarrësit paguajnë ${BOOKING_FEE.toFixed(2)} €, ti asgjë.`}</p>
          </div>
        </div>
      )}

      {/* ══════════ DARKA E SË MËRKURËS — KUIZI ══════════ */}
      {showWed && (
        <div className="sheet-wrap" onClick={() => matchState !== "matching" && setShowWed(false)}>
          <div className="sheet" onClick={(e) => e.stopPropagation()}>
            {matchState === "quiz" && (
              <>
                <div className="sheet-hdr">
                  <button className="icon-btn" onClick={() => setShowWed(false)} aria-label="Mbyll"><X size={18} /></button>
                  <div><h2>✦ Darka e së Mërkurës</h2><p className="meta">Pyetja {quizStep + 1} nga {QUIZ.length}</p></div>
                </div>
                <div className="quiz-bar"><div className="quiz-fill" style={{ width: `${(quizStep / QUIZ.length) * 100}%` }} /></div>
                <p className="quiz-q">{QUIZ[quizStep].q}</p>
                <div className="ob-choice">
                  {QUIZ[quizStep].opts.map((o) => (
                    <button key={o} className="choice" onClick={() => answerQuiz(o)}>{o}</button>
                  ))}
                </div>
                <p className="fee-note"><Sparkles size={11} /> Përgjigjet përdoren vetëm për të të ulur me njerëz me interesa të ngjashme</p>
              </>
            )}
            {matchState === "matching" && (
              <div className="pay-success">
                <div className="success-ring spin-ring"><Sparkles size={30} /></div>
                <h2>Duke të përputhur…</h2>
                <p className="muted">Po krahasojmë përgjigjet e tua me qindra të tjerë në Prishtinë</p>
              </div>
            )}
            {matchState === "matched" && (
              <div className="pay-success">
                <div className="success-ring"><PartyPopper size={34} /></div>
                <h2>U përputhe me 5 persona!</h2>
                <p className="muted">Të njëjtat interesa, energji e ngjashme — sipas kuizit tënd.</p>
                <div className="match-row">
                  {MATCHED_PEOPLE.map((p) => (
                    <div key={p.name} className="person"><Avatar name={p.name} /><span>{p.name}, {p.age}</span></div>
                  ))}
                </div>
                <div className="lock-card slim-lock">
                  <Lock size={16} />
                  <div><strong>E mërkurë, 20:00 · Prishtinë</strong><span>Restoranti zbulohet 24 orë para darkës</span></div>
                </div>
                <button className="btn primary full" onClick={openWedTable}>Shko te tavolina ime ✦</button>
              </div>
            )}
          </div>
        </div>
      )}

      {/* ══════════ VLERËSIMI PAS TAKIMIT ══════════ */}
      {rateFor && (
        <div className="sheet-wrap" onClick={() => setRateFor(null)}>
          <div className="sheet" onClick={(e) => e.stopPropagation()}>
            <div className="sheet-hdr">
              <button className="icon-btn" onClick={() => setRateFor(null)} aria-label="Mbyll"><X size={18} /></button>
              <div><h2>Si ishte përvoja?</h2><p className="meta">{tables.find((t) => t.id === rateFor)?.cafe}</p></div>
            </div>
            <div className="rate-stars">
              {[1, 2, 3, 4, 5].map((n) => (
                <button key={n} className={`star-btn ${n <= rateStars ? "on" : ""}`} onClick={() => setRateStars(n)} aria-label={`${n} yje`}>
                  <span style={{ fontSize: 32, lineHeight: 1, color: n <= rateStars ? "#E3A23C" : "#C4B694" }}>{n <= rateStars ? "★" : "☆"}</span>
                </button>
              ))}
            </div>
            <p className="label center-label">A do të takoheshe sërish me këtë grup?</p>
            <div className="pay-methods">
              <button className={`method ${rateAgain === true ? "on" : ""}`} onClick={() => setRateAgain(true)}>Po, patjetër 😄</button>
              <button className={`method ${rateAgain === false ? "on" : ""}`} onClick={() => setRateAgain(false)}>Ndoshta jo</button>
            </div>
            <p className="label center-label">Me kë do të mbaje kontakt? 💫 (opsionale)</p>
            <p className="muted small center" style={{ marginBottom: 8 }}>Ata nuk e marrin vesh nëse nuk të zgjedhin edhe ty — vetëm përputhjet e ndërsjella hapin chat privat.</p>
            <div className="connect-row">
              {(tables.find((t) => t.id === rateFor)?.joined || []).filter((n) => n !== user.name).map((n) => (
                <button key={n} className={`conn-pick ${rateSelect.includes(n) ? "on" : ""}`}
                  onClick={() => setRateSelect((p) => p.includes(n) ? p.filter((x) => x !== n) : [...p, n])}>
                  <Avatar name={n} small /> {n.split(" ")[0]}
                  {rateSelect.includes(n) && <Check size={13} />}
                </button>
              ))}
            </div>
            <button className="btn primary full" disabled={rateStars === 0 || rateAgain === null} onClick={submitRating}>
              Dërgo vlerësimin
            </button>
            <p className="fee-note"><Sparkles size={11} /> Vlerësimet përdoren për përputhje më të mira dhe për yjet e nikoqirëve</p>
          </div>
        </div>
      )}

      {/* ══════════ PROFILI — dritarja e detyrueshme ══════════ */}
      {profileView && (
        <div className="sheet-wrap centerv" onClick={() => setProfileView(null)}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <button className="icon-btn modal-x" onClick={() => setProfileView(null)} aria-label="Mbyll"><X size={15} /></button>
            {profileView.photo
              ? <img src={profileView.photo} alt={profileView.name} className="prof-photo" />
              : <div className="prof-photo initial">{profileView.name?.[0]?.toUpperCase()}</div>}
            <h2 className="prof-name">
              {profileView.name}{profileView.age ? `, ${profileView.age}` : ""}
              {profileView.verified && <BadgeCheck size={16} className="verified" />}
            </h2>
            {profileView.from && <p className="prof-from">{profileView.from}</p>}
            {profileView.isHost && (
              <div className="prof-stats">
                <span>★ {Number(profileView.rating).toFixed(1)}</span>
                <span>·</span>
                <span>{profileView.tablesHeld} tavolina të mbajtura</span>
              </div>
            )}
            {profileView.langs && <p className="prof-langs"><Globe size={12} /> {profileView.langs.join(" · ")}</p>}
            <p className="prof-note"><ShieldCheck size={13} /> Fotoja e çdo profili kalon kontrollin e fytyrës gjatë regjistrimit — foto të zeza, të njëtrajtshme apo pa fytyrë reale nuk pranohen.</p>
            {profileView.name !== user.name && (
              <button className="btn ghost full" onClick={() => { setReportFor(profileView.name); setProfileView(null); }}>
                <Flag size={13} /> Raporto / Blloko
              </button>
            )}
          </div>
        </div>
      )}

      {/* ══════════ RAPORTO / BLLOKO ══════════ */}
      {reportFor && (
        <div className="sheet-wrap" onClick={() => setReportFor(null)}>
          <div className="sheet" onClick={(e) => e.stopPropagation()}>
            <div className="sheet-hdr">
              <button className="icon-btn" onClick={() => setReportFor(null)} aria-label="Mbyll"><X size={18} /></button>
              <div><h2>🛡️ Raporto / Blloko</h2><p className="meta">{reportFor}</p></div>
            </div>
            <p className="label">Arsyeja e raportimit</p>
            <div className="ob-choice">
              {["Sjellje e papërshtatshme", "Profil i rremë ose foto e huaj", "Spam / reklamë", "Nuk erdhi në takim", "Tjetër"].map((r) => (
                <button key={r} className={`choice ${reportReason === r ? "on" : ""}`} onClick={() => setReportReason(r)}>{r}</button>
              ))}
            </div>
            <label className="toggle-row">
              <input type="checkbox" checked={reportBlock} onChange={(e) => setReportBlock(e.target.checked)} />
              <span>🚫 Blloko gjithashtu — s'do t'i shoh më tavolinat e {reportFor.split(" ")[0]}</span>
            </label>
            <button className="btn primary full" disabled={!reportReason} onClick={submitReport}>Dërgo raportin</button>
            <p className="fee-note">Raportimi është anonim — {reportFor.split(" ")[0]} nuk e merr vesh kush e dërgoi. Ekipi i sigurisë përgjigjet brenda 24 orësh.</p>
          </div>
        </div>
      )}

      {/* ══════════ AI MATCH — KUIZI I PROFILIT ══════════ */}
      {showMQ && (() => {
        const Q = MATCH_QUIZ[mqi];
        const sel = Q.multi ? (profile[Q.key] || []) : profile[Q.key];
        return (
          <div className="sheet-wrap" onClick={() => setShowMQ(false)}>
            <div className="sheet" onClick={(e) => e.stopPropagation()}>
              <div className="sheet-hdr">
                <button className="icon-btn" onClick={() => mqi > 0 ? setMqi(mqi - 1) : setShowMQ(false)} aria-label="Kthehu"><ChevronLeft size={18} /></button>
                <div><h2>✨ Profili i shijeve</h2><p className="meta">Pyetja {mqi + 1} nga {MATCH_QUIZ.length}</p></div>
              </div>
              <div className="quiz-bar"><div className="quiz-fill" style={{ width: `${(mqi / MATCH_QUIZ.length) * 100}%` }} /></div>
              <p className="quiz-q">{Q.q}</p>
              <div className="ob-choice">
                {Q.opts.map(([val, label]) => (
                  <button key={val}
                    className={`choice ${Q.multi ? (sel.includes(val) ? "on" : "") : (sel === val ? "on" : "")}`}
                    onClick={() => answerMQ(Q.key, val, Q.multi, Q.max)}>
                    {label}{Q.multi && sel.includes(val) && "  ✓"}
                  </button>
                ))}
              </div>
              {Q.multi && (
                <button className="btn primary full" disabled={(profile[Q.key] || []).length === 0}
                  onClick={() => mqi < MATCH_QUIZ.length - 1 ? setMqi(mqi + 1) : finishMQ()}>
                  Vazhdo ({(profile[Q.key] || []).length}/{Q.max})
                </button>
              )}
              <button className="link-btn" onClick={() => setShowMQ(false)}>Më vonë</button>
              <p className="fee-note">Përgjigjet përdoren VETËM për renditjen e tavolinave sipas përshtatjes — kurrë nuk u tregohen përdoruesve të tjerë.</p>
            </div>
          </div>
        );
      })()}

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}
