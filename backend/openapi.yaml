components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: access_token from /auth/v1/token (HS256, valid JWT_ACCESS_TTL seconds, default 1 h)
  parameters:
    bucket:
      name: bucket
      in: path
      required: true
      schema:
        type: string
        enum:
        - avatars
    path:
      name: path
      in: path
      required: true
      schema:
        type: string
      description: Object path, e.g. `<uid>/avatar.jpg`
  responses:
    AuthError:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
    DbError:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DbError'
    StorageError:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              statusCode:
                type: string
              error:
                type: string
              message:
                type: string
  schemas:
    Session:
      type: object
      required:
      - access_token
      - refresh_token
      - expires_at
      properties:
        access_token:
          type: string
        token_type:
          const: bearer
        expires_in:
          type: integer
        expires_at:
          type: integer
          description: unix seconds
        refresh_token:
          type: string
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        email_confirmed_at:
          type:
          - string
          - 'null'
        user_metadata:
          type: object
        app_metadata:
          type: object
        identities:
          type: array
          items:
            type: object
        created_at:
          type: string
        last_sign_in_at:
          type:
          - string
          - 'null'
    AuthError:
      type: object
      properties:
        message:
          type: string
        msg:
          type: string
        code:
          type:
          - string
          - 'null'
          description: e.g. invalid_credentials, email_not_confirmed, user_banned, refresh_token_not_found,
            user_already_exists, bad_jwt, over_request_rate_limit
        error:
          type: string
    DbError:
      type: object
      properties:
        message:
          type: string
          description: human readable (Albanian for business rules)
        code:
          type:
          - string
          - 'null'
          description: Postgres / PostgREST code, e.g. P0001, 42501, PGRST202
        details:
          type:
          - string
          - 'null'
        hint:
          type:
          - string
          - 'null'
    Filter:
      type: object
      properties:
        col:
          type: string
        op:
          type: string
          enum:
          - eq
          - neq
          - gt
          - gte
          - lt
          - lte
          - like
          - ilike
          - is
          - in
          - cs
          - cd
          - ov
        value: {}
        negate:
          type: boolean
        or:
          type: string
        and:
          type: string
    Query:
      type: object
      required:
      - table
      properties:
        table:
          type: string
          enum:
          - admin_audit_log
          - affinity
          - badges
          - bans
          - blocks
          - connection_picks
          - connections
          - lesson_participants
          - lesson_rooms
          - lesson_subjects
          - lessons
          - memberships
          - messages
          - notification_badge_labels
          - notification_text_rules
          - notifications
          - payments
          - plans
          - profiles
          - ratings
          - reports
          - requests
          - subscription_orders
          - subscriptions
          - tables
          - taste_profiles
          - tutors
          - waitlist
          - wednesday_groups
          - wednesday_participants
          - wednesday_restaurants
          - wednesday_signups
        action:
          type: string
          enum:
          - select
          - insert
          - upsert
          - update
          - delete
          default: select
        select:
          type: string
          default: '*'
        filters:
          type: array
          items:
            $ref: '#/components/schemas/Filter'
        order:
          type: array
          items:
            type: object
            properties:
              col:
                type: string
              ascending:
                type: boolean
                default: true
              nullsFirst:
                type: boolean
        limit:
          type: integer
        offset:
          type: integer
        single:
          type: boolean
          description: exactly one row, else 406 PGRST116
        maybeSingle:
          type: boolean
        count:
          type:
          - string
          - 'null'
          enum:
          - exact
          - planned
          - estimated
          - null
        head:
          type: boolean
        values:
          description: 'insert/upsert: row or rows; update: changed columns'
        onConflict:
          type: string
          description: 'upsert: comma-separated conflict columns'
        ignoreDuplicates:
          type: boolean
        returning:
          type: boolean
          description: return the written rows (with `select`)
